<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Browser</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/browser.css">
    <link rel="icon" href="./assets/icon.png" type="image/x-icon">

  </head>
  <body>
    <div class="browser-nav">
      <div class="nav-top overlay" id="browser-back">
        <span class="material-symbols-rounded">close</span>
      </div>
      <div class="nav-top overlay" id="browser-actions">
        <span class="material-symbols-rounded" id="browser-share">ios_share</span>
        <span class="material-symbols-rounded" id="browser-open-external">open_in_new</span>
      </div>
    </div>
    <div class="browser-content">
      <div class="browser-loading" id="browser-loading">
        <span class="material-symbols-rounded">progress_activity</span>
      </div>
      <iframe id="browser-iframe" title="Website" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-top-navigation allow-top-navigation-by-user-activation allow-downloads allow-pointer-lock allow-popups-to-escape-sandbox"></iframe>
    </div>
  </body>
  <script src="scripts/storage.js"></script>
  <script src="scripts/script.js"></script>
  <script src="scripts/browser.js"></script>
</html>
