<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Space — Flit</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/new-space.css">
    <link rel="icon" href="./assets/icon.png" type="image/x-icon">
    <meta name="view-transition" content="same-origin" />

  </head>
  <body>

    <div class="top">
      <div class="header-nav-top">
        <div class="nav-top-all">
          <div class="nav-top overlay" id="back-btn">
            <span class="material-symbols-rounded">arrow_back_ios_new</span>
          </div>
        </div>
        <div class="header-top-info">
          <h1 id="page-title" data-i18n="add_a_space">Add a Space</h1>
        </div>
      </div>
    </div>

    <div class="ns-content">

      <p class="ns-label" data-i18n="name_your_space">Name your space</p>

      <div class="ns-name-row">
        <div class="ns-emoji-btn">
          <input class="ns-emoji-input" id="ns-emoji-input" type="text" placeholder="🌐" />
        </div>
        <div class="ns-input-pill">
          <input class="ns-input" type="text" placeholder="Space Name" data-i18n-placeholder="space_name_placeholder" />
        </div>
      </div>

      <hr>

      <p class="ns-label" data-i18n="edit_theme">Edit theme</p>

      <div class="ns-theme-section">
        <div class="ns-canvas-wrapper">
          <canvas id="color-canvas" width="180" height="180"></canvas>
        </div>

        <div class="ns-theme-controls">
          <div class="ns-theme-btn overlay" id="btn-shuffle">
            <span class="material-symbols-rounded">shuffle</span>
          </div>
          <div class="ns-theme-btn overlay" id="btn-light">
            <span class="material-symbols-rounded">light_mode</span>
          </div>
          <div class="ns-theme-btn overlay" id="btn-dark">
            <span class="material-symbols-rounded">dark_mode</span>
          </div>
          <div class="ns-theme-btn overlay" id="btn-mono">
            <span class="material-symbols-rounded">filter_b_and_w</span>
          </div>
        </div>
      </div>

    </div>

    <div class="btn overlay" id="create-btn">
      <span class="material-symbols-rounded" id="create-btn-icon">add_2</span>
      <p id="create-btn-label" data-i18n="create_your_space">Create your Space</p>
    </div>

  </body>
  <script src="scripts/transitions.js"></script>
  <script src="scripts/storage.js"></script>
  <script src="scripts/i18n.js"></script>
  <script src="scripts/script.js"></script>
  <script src="scripts/new-space.js"></script>
</html>
