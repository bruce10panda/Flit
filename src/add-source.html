<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Add a Source — Flit</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="styles/add-source.css">
    <link rel="icon" href="./assets/icon.png" type="image/x-icon">
    <meta name="view-transition" content="same-origin" />

  </head>
  <body>
    <div class="top">
      <div class="header-nav-top">
        <div class="nav-top-all">
          <div class="nav-top overlay" id="back-btn">
            <span class="material-symbols-rounded">arrow_back_ios_new</span>
          </div>
        </div>
        <div class="header-top-info">
          <h1 data-i18n="add_a_source">Add a Source</h1>
        </div>
      </div>
    </div>

    <div class="source-list">

      <div class="source-section">
        <div class="source-header">
          <div class="source-header-left">
            <span class="material-symbols-rounded source-icon--rss">rss_feed</span>
            <p data-i18n="rss_feed">RSS Feed</p>
          </div>
          <span class="material-symbols-rounded source-chevron">chevron_right</span>
        </div>
        <div class="source-body">
          <div class="source-input-row">
            <div class="source-input-pill">
              <input class="source-input" type="url" placeholder="https://flit.news/rss" data-i18n-placeholder="rss_placeholder" />
            </div>
            <button class="source-add-btn"><span class="material-symbols-rounded">add</span></button>
          </div>
        </div>
      </div>

      <hr>

      <div class="source-section">
        <div class="source-header">
          <div class="source-header-left">
            <span class="source-icon--bluesky"></span>
            <p data-i18n="bluesky">Bluesky</p>
          </div>
          <span class="material-symbols-rounded source-chevron">chevron_right</span>
        </div>
        <div class="source-body">
          <div class="source-input-row">
            <div class="source-input-pill">
              <input class="source-input" type="text" placeholder="@flit.news" data-i18n-placeholder="bsky_placeholder" />
            </div>
            <button class="source-add-btn"><span class="material-symbols-rounded">add</span></button>
          </div>
        </div>
      </div>

    </div>
  </body>
  <script src="scripts/transitions.js"></script>
  <script src="scripts/storage.js"></script>
  <script src="scripts/i18n.js"></script>
  <script src="scripts/script.js"></script>
  <script src="scripts/add-source.js"></script>
</html>
